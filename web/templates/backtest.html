<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}TradeSimulado - Backtest{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('static', path='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                <i class="bi bi-graph-up-arrow"></i> TradeSimulado
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-house"></i> Início</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/backtest"><i class="bi bi-bar-chart"></i> Backtest</a></li>
                    <li class="nav-item ms-2">
                        <button class="btn btn-sm btn-outline-secondary" id="themeToggle" title="Alternar tema">
                            <i class="bi bi-moon-stars" id="themeIcon"></i>
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4">
        <div class="row">
            <div class="col-lg-3">
                <div class="card border-primary mb-3">
                    <div class="card-header"><i class="bi bi-gear"></i> Configuração</div>
                    <div class="card-body">
                        <form id="backtestForm">
                            <div class="mb-2">
                                <label class="form-label small">Estratégia</label>
                                <select class="form-select form-select-sm" id="estrategia" required>
                                    <option value="">Selecione...</option>
                                    {% for chave, info in estrategias.items() %}
                                    <option value="{{ chave }}">{{ info.nome }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="row mb-2">
                                <div class="col-6">
                                    <label class="form-label small">Saldo (USDT)</label>
                                    <input type="number" class="form-control form-control-sm" id="saldo" value="1000">
                                </div>
                                <div class="col-6">
                                    <label class="form-label small">Qtd</label>
                                    <input type="number" class="form-control form-control-sm" id="quantidade" value="0.1" step="0.01">
                                </div>
                            </div>
                            <div class="mb-2">
                                <label class="form-label small">Dados</label>
                                <select class="form-select form-select-sm" id="tipoDado">
                                    <option value="tendencia">Tendência (3 fases)</option>
                                    <option value="sintetico">Sintético</option>
                                </select>
                            </div>
                            <div class="row mb-2">
                                <div class="col-6">
                                    <label class="form-label small">Candles</label>
                                    <input type="number" class="form-control form-control-sm" id="nCandles" value="500" step="100">
                                </div>
                                <div class="col-6">
                                    <label class="form-label small">Preço Ini.</label>
                                    <input type="number" class="form-control form-control-sm" id="precoInicial" value="600">
                                </div>
                            </div>
                            <div class="row mb-2">
                                <div class="col-6">
                                    <label class="form-label small">Stop (%)</label>
                                    <input type="number" class="form-control form-control-sm" id="stopLoss" value="2" step="0.5">
                                </div>
                                <div class="col-6">
                                    <label class="form-label small">Take (%)</label>
                                    <input type="number" class="form-control form-control-sm" id="takeProfit" value="4" step="0.5">
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 btn-sm" id="btnExecutar">
                                <i class="bi bi-play"></i> Executar
                            </button>
                        </form>
                    </div>
                </div>

                <div class="card border-secondary mb-3">
                    <div class="card-header"><i class="bi bi-arrow-left-right"></i> Comparar</div>
                    <div class="card-body">
                        <form id="compararForm">
                            <div class="mb-2">
                                <label class="form-label small">Estratégias (vírgula)</label>
                                <input type="text" class="form-control form-control-sm" id="estrategiasLista" value="rsi, bollinger, combinacao">
                            </div>
                            <div class="row mb-2">
                                <div class="col-6">
                                    <label class="form-label small">Candles</label>
                                    <input type="number" class="form-control form-control-sm" id="compCandles" value="500">
                                </div>
                                <div class="col-6">
                                    <label class="form-label small">Saldo</label>
                                    <input type="number" class="form-control form-control-sm" id="compSaldo" value="1000">
                                </div>
                            </div>
                            <button type="submit" class="btn btn-outline-info w-100 btn-sm">
                                <i class="bi bi-bar-chart"></i> Comparar
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-lg-9">
                <div id="loadingSpinner" style="display:none;" class="text-center py-5">
                    <div class="spinner-border text-primary" role="status" style="width:3rem;height:3rem;"></div>
                    <p class="mt-2 text-secondary">Executando backtest...</p>
                </div>

                <div id="resultadoArea" style="display:none;">
                    <div class="card border-success mb-3">
                        <div class="card-header d-flex justify-content-between align-items-center py-2">
                            <span><i class="bi bi-check-circle text-success"></i> <span id="estrategiaNome"></span></span>
                            <span id="tempoExecucao" class="badge bg-secondary"></span>
                        </div>
                        <div class="card-body py-2" id="metricsPanel">
                            <div class="row text-center g-2">
                                <div class="col-3 col-md">
                                    <div class="metric-box">
                                        <div class="metric-value h4 mb-0" id="totalTrades">0</div>
                                        <div class="metric-label small">Trades</div>
                                    </div>
                                </div>
                                <div class="col-3 col-md">
                                    <div class="metric-box">
                                        <div class="metric-value h4 mb-0" id="lucroValor">$0</div>
                                        <div class="metric-label small">Lucro</div>
                                    </div>
                                </div>
                                <div class="col-3 col-md">
                                    <div class="metric-box">
                                        <div class="metric-value h4 mb-0" id="retornoPercent">0%</div>
                                        <div class="metric-label small">Retorno</div>
                                    </div>
                                </div>
                                <div class="col-3 col-md">
                                    <div class="metric-box">
                                        <div class="metric-value h4 mb-0" id="taxaAcerto">0%</div>
                                        <div class="metric-label small">Acerto</div>
                                    </div>
                                </div>
                                <div class="col-3 col-md">
                                    <div class="metric-box">
                                        <div class="metric-value h4 mb-0" id="saldoFinal">$0</div>
                                        <div class="metric-label small">Saldo Final</div>
                                    </div>
                                </div>
                                <div class="col-3 col-md">
                                    <div class="metric-box">
                                        <div class="metric-value h4 mb-0" id="portfolioValor">$0</div>
                                        <div class="metric-label small">Portfolio</div>
                                    </div>
                                </div>
                            </div>
                            <div class="progress mt-2" style="height:6px;">
                                <div class="progress-bar" id="progressAcerto" role="progressbar" style="width:0%"></div>
                            </div>
                        </div>
                    </div>

                    <div class="card border-secondary mb-3">
                        <div class="card-header d-flex justify-content-between align-items-center py-2">
                            <span><i class="bi bi-graph-up"></i> Gráfico de Candles</span>
                            <div class="btn-group btn-group-sm">
                                <button class="btn btn-outline-secondary btn-sm chart-reset" onclick="chartReset()">
                                    <i class="bi bi-arrows-angle-expand"></i>
                                </button>
                            </div>
                        </div>
                        <div class="card-body p-2" id="chartContainer">
                            <div id="tvChart" style="width:100%;height:420px;"></div>
                        </div>
                    </div>

                    <div class="card border-secondary mb-3">
                        <div class="card-header d-flex justify-content-between align-items-center py-2">
                            <span><i class="bi bi-table"></i> Trades</span>
                            <div>
                                <span class="small text-secondary me-2" id="tradeCount"></span>
                                <button class="btn btn-outline-secondary btn-sm" onclick="sortTable('preco')">
                                    <i class="bi bi-sort-numeric-down"></i>
                                </button>
                            </div>
                        </div>
                        <div class="card-body p-0" style="max-height:320px;overflow-y:auto;">
                            <table class="table table-sm mb-0" id="tradesTable">
                                <thead class="table-head-sticky">
                                    <tr>
                                        <th onclick="sortTable('num')" style="cursor:pointer;"># <i class="bi bi-arrow-down-up small"></i></th>
                                        <th onclick="sortTable('tipo')" style="cursor:pointer;">Tipo</th>
                                        <th onclick="sortTable('preco')" style="cursor:pointer;">Preço</th>
                                        <th onclick="sortTable('qtd')" style="cursor:pointer;">Qtd</th>
                                        <th>Motivo</th>
                                        <th>Data</th>
                                    </tr>
                                </thead>
                                <tbody id="tradesBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div id="compararArea" style="display:none;">
                    <div class="card border-info mb-3">
                        <div class="card-header"><i class="bi bi-bar-chart"></i> Comparativo</div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-sm" id="tabelaComparar">
                                    <thead><tr><th>Estratégia</th><th>Trades</th><th>Lucro</th><th>Retorno</th><th>Acerto</th></tr></thead>
                                    <tbody id="compararBody"></tbody>
                                </table>
                            </div>
                            <div style="height:250px;"><canvas id="chartComparar"></canvas></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/lightweight-charts@4.2.1/dist/lightweight-charts.standalone.production.js"></script>
    <script src="{{ url_for('static', path='js/app.js') }}"></script>
    <script>
    let chart = null;
    let series = null;
    let markersData = [];
    let tradesData = [];
    let sortAsc = true;
    let sortField = 'num';

    document.addEventListener('DOMContentLoaded', () => {
        initTheme();
        document.getElementById('backtestForm').addEventListener('submit', executarBacktest);
        document.getElementById('compararForm').addEventListener('submit', compararEstrategias);
    });

    function initChart() {
        const container = document.getElementById('tvChart');
        if (!container) return;
        chart = LightweightCharts.createChart(container, {
            layout: { textColor: '#9ca3af', background: { type: 'solid', color: 'transparent' } },
            grid: { vertLines: { color: '#1f2937' }, horzLines: { color: '#1f2937' } },
            crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
            rightPriceScale: { borderColor: '#374151' },
            timeScale: { borderColor: '#374151', timeVisible: true, secondsVisible: false },
            handleScroll: { vertTouchDrag: false },
        });
        series = chart.addCandlestickSeries({
            upColor: '#22c55e', downColor: '#ef4444',
            borderDownColor: '#ef4444', borderUpColor: '#22c55e',
            wickDownColor: '#ef4444', wickUpColor: '#22c55e',
        });
        chart.timeScale().fitContent();
        window.addEventListener('resize', () => {
            if (chart) chart.resize(container.clientWidth, 420);
        });
    }

    function chartReset() {
        if (chart) chart.timeScale().fitContent();
    }

    async function executarBacktest(e) {
        e.preventDefault();
        const est = document.getElementById('estrategia').value;
        if (!est) { alert('Selecione uma estratégia'); return; }

        const form = new FormData();
        form.append('estrategia', est);
        form.append('saldo', document.getElementById('saldo').value);
        form.append('quantidade', document.getElementById('quantidade').value);
        form.append('n_candles', document.getElementById('nCandles').value);
        form.append('preco_inicial', document.getElementById('precoInicial').value);
        form.append('tipo_dado', document.getElementById('tipoDado').value);
        form.append('stop_loss', parseFloat(document.getElementById('stopLoss').value) / 100);
        form.append('take_profit', parseFloat(document.getElementById('takeProfit').value) / 100);

        document.getElementById('resultadoArea').style.display = 'none';
        document.getElementById('loadingSpinner').style.display = 'block';

        try {
            const res = await fetch('/api/backtest/executar', { method: 'POST', body: form });
            const data = await res.json();
            document.getElementById('loadingSpinner').style.display = 'none';
            if (!data.ok) { alert('Erro: ' + (data.erro || '')); return; }

            const r = data.resultado;
            tradesData = r.trades || [];
            document.getElementById('resultadoArea').style.display = 'block';
            if (chart) {
                setTimeout(() => chart.resize(document.getElementById('tvChart').clientWidth, 420), 50);
            }
            document.getElementById('estrategiaNome').textContent = r.estrategia;
            document.getElementById('tempoExecucao').textContent = r.tempo_execucao + 's';
            document.getElementById('totalTrades').textContent = r.total_trades;
            document.getElementById('lucroValor').textContent = (r.lucro_usdt >= 0 ? '+' : '') + '$' + Math.abs(r.lucro_usdt).toFixed(2);
            document.getElementById('lucroValor').className = 'metric-value h4 mb-0 ' + (r.lucro_usdt >= 0 ? 'text-success' : 'text-danger');
            document.getElementById('retornoPercent').textContent = (r.retorno_percentual >= 0 ? '+' : '') + r.retorno_percentual.toFixed(2) + '%';
            document.getElementById('retornoPercent').className = 'metric-value h4 mb-0 ' + (r.retorno_percentual >= 0 ? 'text-success' : 'text-danger');
            document.getElementById('taxaAcerto').textContent = r.taxa_acerto.toFixed(1) + '%';
            document.getElementById('saldoFinal').textContent = '$' + r.saldo_final.toFixed(2);
            document.getElementById('portfolioValor').textContent = '$' + r.portfolio.toFixed(2);
            const pbar = document.getElementById('progressAcerto');
            pbar.style.width = Math.min(r.taxa_acerto, 100) + '%';
            pbar.className = 'progress-bar bg-' + (r.taxa_acerto >= 50 ? 'success' : 'warning');
            document.getElementById('tradeCount').textContent = tradesData.length + ' trades';

            renderTabela();
            renderGrafico(r.candle_data, r.trade_markers, r.sl_tp_levels);
        } catch (err) {
            document.getElementById('loadingSpinner').style.display = 'none';
            alert('Erro: ' + err.message);
        }
    }

    function renderGrafico(candleData, markers, slTpLevels) {
        if (!chart) initChart();
        if (!chart || !series) return;
        try { series.setData(candleData || []); } catch (e) { console.error('Erro no grafico:', e); }
        if (markers && markers.length) {
            series.setMarkers(markers);
        }
        chart.timeScale().fitContent();

        if (slTpLevels && slTpLevels.length) {
            slTpLevels.forEach((pair, idx) => {
                const lines = ['stop_loss', 'take_profit'].map(type => {
                    const price = type === 'stop_loss' ? pair.stop_loss : pair.take_profit;
                    const color = type === 'stop_loss' ? '#ef4444' : '#22c55e';
                    const line = chart.addLineSeries({
                        color, lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Dashed,
                        lastValueVisible: false, title: type === 'stop_loss' ? 'SL' : 'TP',
                    });
                    line.setData([
                        { time: Math.floor(new Date(pair.buy_time).getTime() / 1000), value: price },
                        { time: Math.floor(new Date(pair.sell_time).getTime() / 1000), value: price },
                    ]);
                    return line;
                });
            });
        }
    }

    function renderTabela() {
        const tbody = document.getElementById('tradesBody');
        tbody.innerHTML = '';
        const data = [...tradesData];
        const cmp = sortAsc ? 1 : -1;
        data.sort((a, b) => {
            if (sortField === 'num') return cmp * (data.indexOf(a) - data.indexOf(b));
            if (sortField === 'preco') return cmp * (a.preco - b.preco);
            if (sortField === 'tipo') return cmp * a.tipo.localeCompare(b.tipo);
            if (sortField === 'qtd') return cmp * (a.quantidade - b.quantidade);
            return 0;
        });
        data.forEach((t, i) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${i+1}</td>
                <td><span class="badge bg-${t.tipo === 'BUY' ? 'success' : 'danger'}">${t.tipo}</span></td>
                <td>$${t.preco.toFixed(2)}</td>
                <td>${t.quantidade}</td>
                <td><span class="badge bg-secondary">${t.motivo || '-'}</span></td>
                <td class="small">${t.timestamp || ''}</td>`;
            tbody.appendChild(tr);
        });
    }

    function sortTable(field) {
        if (sortField === field) sortAsc = !sortAsc;
        else { sortField = field; sortAsc = true; }
        renderTabela();
    }

    async function compararEstrategias(e) {
        e.preventDefault();
        const form = new FormData();
        form.append('estrategias_lista', document.getElementById('estrategiasLista').value);
        form.append('saldo', document.getElementById('compSaldo').value);
        form.append('quantidade', '0.1');
        form.append('n_candles', document.getElementById('compCandles').value);
        form.append('preco_inicial', '600');
        document.getElementById('compararArea').style.display = 'none';
        document.getElementById('loadingSpinner').style.display = 'block';
        try {
            const res = await fetch('/api/backtest/comparar', { method: 'POST', body: form });
            const data = await res.json();
            document.getElementById('loadingSpinner').style.display = 'none';
            if (!data.ok) { alert('Erro: ' + (data.erro || '')); return; }
            document.getElementById('compararArea').style.display = 'block';
            const tbody = document.getElementById('compararBody');
            tbody.innerHTML = '';
            const sorted = data.resultados.sort((a, b) => b.lucro - a.lucro);
            sorted.forEach(r => {
                const tr = document.createElement('tr');
                const cls = r.lucro >= 0 ? 'text-success' : 'text-danger';
                tr.innerHTML = `<td><strong>${r.estrategia}</strong></td><td>${r.trades}</td>
                    <td class="${cls}">${r.lucro >= 0 ? '+' : ''}$${r.lucro.toFixed(2)}</td>
                    <td class="${cls}">${r.retorno >= 0 ? '+' : ''}${r.retorno.toFixed(2)}%</td>
                    <td>${r.acerto.toFixed(1)}%</td>`;
                tbody.appendChild(tr);
            });
            const ctx = document.getElementById('chartComparar').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: sorted.map(r => r.estrategia),
                    datasets: [
                        { label: 'Lucro ($)', data: sorted.map(r => r.lucro), backgroundColor: sorted.map(r => r.lucro >= 0 ? '#22c55e' : '#ef4444') },
                        { label: 'Acerto (%)', data: sorted.map(r => r.acerto), backgroundColor: '#3b82f6' }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'top' } } }
            });
        } catch (err) {
            document.getElementById('loadingSpinner').style.display = 'none';
            alert('Erro: ' + err.message);
        }
    }

    function initTheme() {
        const saved = localStorage.getItem('theme');
        if (saved === 'light') setTheme('light');
        document.getElementById('themeToggle')?.addEventListener('click', toggleTheme);
    }

    function toggleTheme() {
        const html = document.documentElement;
        const isDark = html.getAttribute('data-bs-theme') === 'dark';
        setTheme(isDark ? 'light' : 'dark');
    }

    function setTheme(theme) {
        document.documentElement.setAttribute('data-bs-theme', theme);
        localStorage.setItem('theme', theme);
        const icon = document.getElementById('themeIcon');
        if (icon) icon.className = theme === 'dark' ? 'bi bi-moon-stars' : 'bi bi-sun';
        if (chart) {
            chart.applyOptions({
                layout: { textColor: theme === 'dark' ? '#9ca3af' : '#4b5563' },
                grid: {
                    vertLines: { color: theme === 'dark' ? '#1f2937' : '#e5e7eb' },
                    horzLines: { color: theme === 'dark' ? '#1f2937' : '#e5e7eb' },
                },
            });
        }
    }
    </script>
</body>
</html>
