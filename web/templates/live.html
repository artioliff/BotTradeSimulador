<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TradeSimulado - Live Trading</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('static', path='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                <i class="bi bi-graph-up-arrow"></i> TradeSimulado
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-house"></i> Início</a></li>
                    <li class="nav-item"><a class="nav-link" href="/backtest"><i class="bi bi-bar-chart"></i> Backtest</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/live"><i class="bi bi-lightning"></i> Live</a></li>
                    <li class="nav-item ms-2">
                        <button class="btn btn-sm btn-outline-secondary" id="themeToggle" title="Alternar tema">
                            <i class="bi bi-moon-stars" id="themeIcon"></i>
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4">
        <div class="row">
            <div class="col-lg-3">
                <div class="card border-danger mb-3">
                    <div class="card-header"><i class="bi bi-lightning-fill text-danger"></i> Live Trading</div>
                    <div class="card-body">
                        <form id="liveForm">
                            <div class="mb-2">
                                <label class="form-label small">Estratégia</label>
                                <select class="form-select form-select-sm" id="estrategia" required>
                                    {% for chave, info in estrategias.items() %}
                                    <option value="{{ chave }}" {% if chave == 'combinacao' %}selected{% endif %}>{{ info.nome }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="mb-2">
                                <label class="form-label small">Par (Symbol)</label>
                                <input type="text" class="form-control form-control-sm" id="symbol" value="BNBUSDT">
                            </div>
                            <div class="row mb-2">
                                <div class="col-6">
                                    <label class="form-label small">Saldo (USDT)</label>
                                    <input type="number" class="form-control form-control-sm" id="saldo" value="100">
                                </div>
                                <div class="col-6">
                                    <label class="form-label small">Qtd por trade</label>
                                    <input type="number" class="form-control form-control-sm" id="quantidade" value="0.01" step="0.001">
                                </div>
                            </div>
                            <div class="mb-2">
                                <label class="form-label small">Intervalo</label>
                                <select class="form-select form-select-sm" id="interval">
                                    <option value="1m">1 minuto</option>
                                    <option value="5m">5 minutos</option>
                                    <option value="15m">15 minutos</option>
                                    <option value="1h">1 hora</option>
                                </select>
                            </div>
                            <div class="form-check form-switch mb-2">
                                <input class="form-check-input" type="checkbox" id="liveMode">
                                <label class="form-check-label small" for="liveMode">
                                    <span class="text-danger fw-bold">LIVE MODE</span> (ordens reais)
                                </label>
                            </div>
                            <div class="form-check form-switch mb-3">
                                <input class="form-check-input" type="checkbox" id="testnet" checked>
                                <label class="form-check-label small" for="testnet">Usar Testnet</label>
                            </div>
                            <button type="submit" class="btn btn-danger w-100" id="btnIniciar">
                                <i class="bi bi-play-fill"></i> Iniciar Bot
                            </button>
                            <button type="button" class="btn btn-secondary w-100 mt-2" id="btnParar" style="display:none;">
                                <i class="bi bi-stop-fill"></i> Parar Bot
                            </button>
                        </form>
                        <div id="statusInfo" class="mt-2 small text-center"></div>
                    </div>
                </div>
            </div>

            <div class="col-lg-9">
                <div class="card border-secondary mb-3">
                    <div class="card-header d-flex justify-content-between align-items-center py-2">
                        <span><i class="bi bi-graph-up"></i> Gráfico</span>
                        <span>
                            <span id="tradeCount" class="badge bg-info me-2" style="display:none;">0 trades</span>
                            <span id="statusBadge" class="badge bg-secondary me-2">Parado</span>
                            <span id="pidDisplay" class="badge bg-dark" style="display:none;">PID: --</span>
                        </span>
                    </div>
                    <div class="card-body p-2">
                        <div id="tvChart" style="height:35vh;"></div>
                    </div>
                </div>
                <div class="card border-secondary">
                    <div class="card-header d-flex justify-content-between align-items-center py-2">
                        <span><i class="bi bi-terminal"></i> Log do Bot</span>
                    </div>
                    <div class="card-body p-0">
                        <pre id="logOutput" style="height:30vh;overflow-y:auto;padding:0.75rem;margin:0;font-size:0.78rem;background:#0d1117;color:#c9d1d9;border-radius:0;font-family:'Cascadia Code','Fira Code','Consolas',monospace;white-space:pre-wrap;word-break:break-word;"></pre>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/lightweight-charts@4.2.1/dist/lightweight-charts.standalone.production.js"></script>
    <script>
        let pollInterval = null;
        let candleInterval = null;
        let botRunning = false;
        let chart = null;
        let series = null;

        function setTheme(theme) {
            document.documentElement.setAttribute('data-bs-theme', theme);
            localStorage.setItem('theme', theme);
            const icon = document.getElementById('themeIcon');
            if (icon) icon.className = theme === 'dark' ? 'bi bi-moon-stars' : 'bi bi-sun';
            if (chart) {
                const isDark = theme === 'dark';
                chart.applyOptions({
                    layout: { textColor: isDark ? '#9ca3af' : '#4b5563' },
                    grid: { vertLines: { color: isDark ? '#1f2937' : '#e5e7eb' }, horzLines: { color: isDark ? '#1f2937' : '#e5e7eb' } },
                    rightPriceScale: { borderColor: isDark ? '#1f2937' : '#e5e7eb' },
                });
            }
        }

        function toggleTheme() {
            const html = document.documentElement;
            setTheme(html.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark');
        }

        function initTheme() {
            const saved = localStorage.getItem('theme');
            if (saved === 'light') setTheme('light');
            document.getElementById('themeToggle')?.addEventListener('click', toggleTheme);
        }

        function atualizarUI(running, pid) {
            botRunning = running;
            document.getElementById('btnIniciar').style.display = running ? 'none' : '';
            document.getElementById('btnParar').style.display = running ? '' : 'none';

            const badge = document.getElementById('statusBadge');
            badge.textContent = running ? 'Executando' : 'Parado';
            badge.className = 'badge ' + (running ? 'bg-danger' : 'bg-secondary');

            const pidEl = document.getElementById('pidDisplay');
            if (running && pid) {
                pidEl.textContent = 'PID: ' + pid;
                pidEl.style.display = '';
            } else {
                pidEl.style.display = 'none';
            }

            document.getElementById('statusInfo').innerHTML = running
                ? '<span class="text-success">Bot em execucao</span>'
                : '<span class="text-secondary">Bot parado</span>';
        }

        async function iniciarBot(e) {
            e.preventDefault();
            if (botRunning) return;

            const form = new FormData();
            form.append('symbol', document.getElementById('symbol').value.toUpperCase());
            form.append('estrategia', document.getElementById('estrategia').value);
            form.append('saldo', document.getElementById('saldo').value);
            form.append('quantidade', document.getElementById('quantidade').value);
            form.append('interval', document.getElementById('interval').value);
            form.append('live_mode', document.getElementById('liveMode').checked);
            form.append('testnet', document.getElementById('testnet').checked);

            document.getElementById('logOutput').textContent = 'Iniciando bot...\n';

            try {
                const res = await fetch('/api/live/iniciar', { method: 'POST', body: form });
                const data = await res.json();
                if (!data.ok) { alert('Erro: ' + (data.erro || '')); return; }
                atualizarUI(true, data.pid);
                iniciarPolling();
            } catch (err) {
                alert('Erro: ' + err.message);
            }
        }

        async function pararBot() {
            if (!botRunning) return;
            if (!confirm('Tem certeza que deseja parar o bot?')) return;

            try {
                const res = await fetch('/api/live/parar', { method: 'POST' });
                const data = await res.json();
                if (!data.ok) { alert('Erro: ' + (data.erro || '')); return; }
                atualizarUI(false, null);
                pararPolling();
            } catch (err) {
                alert('Erro: ' + err.message);
            }
        }

        function initChart() {
            try {
                const container = document.getElementById('tvChart');
                if (!container || chart) return;
                const theme = localStorage.getItem('theme') || 'dark';
                const isDark = theme === 'dark';
                chart = LightweightCharts.createChart(container, {
                    height: container.clientHeight || 400,
                    layout: { textColor: isDark ? '#9ca3af' : '#4b5563', background: { type: 'solid', color: isDark ? '#0d1117' : '#ffffff' } },
                    grid: { vertLines: { color: isDark ? '#1f2937' : '#e5e7eb' }, horzLines: { color: isDark ? '#1f2937' : '#e5e7eb' } },
                    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
                    timeScale: { timeVisible: true, secondsVisible: false },
                    rightPriceScale: { borderColor: isDark ? '#1f2937' : '#e5e7eb' },
                });
                series = chart.addCandlestickSeries({
                    upColor: '#22c55e', downColor: '#ef4444',
                    borderUpColor: '#22c55e', borderDownColor: '#ef4444',
                    wickUpColor: '#22c55e', wickDownColor: '#ef4444',
                });
                chart.timeScale().fitContent();
                window.addEventListener('resize', () => {
                    const w = container.clientWidth;
                    const h = container.clientHeight || 400;
                    if (w > 0 && h > 0) chart.resize(w, h);
                });
            } catch (e) {
                console.error('Erro ao criar grafico:', e);
            }
        }

        function atualizarChart(data) {
            if (!chart) initChart();
            if (!chart || !series) return;
            if (data.candles && data.candles.length) {
                try {
                    series.setData(data.candles);
                    chart.timeScale().fitContent();
                } catch (e) {
                    console.error('Erro no setData:', e, 'dados:', data.candles.slice(0, 2));
                }
            }
            if (data.trades && data.trades.length) {
                try {
                    const markers = data.trades.map(t => ({
                        time: t.time,
                        position: t.tipo === 'SELL' ? 'aboveBar' : 'belowBar',
                        color: t.tipo === 'SELL' ? '#ef4444' : '#22c55e',
                        shape: t.tipo === 'SELL' ? 'arrowDown' : 'arrowUp',
                        text: (t.tipo === 'SELL' ? 'V' : 'C') + ' $' + (t.preco || 0).toFixed(2),
                        size: 1.5,
                    }));
                    series.setMarkers(markers);
                } catch (e) {
                    console.error('Erro nos markers:', e);
                }
                document.getElementById('tradeCount').textContent = data.trades.length + ' trades';
                document.getElementById('tradeCount').style.display = '';
            }
        }

        async function buscarCandles() {
            try {
                const res = await fetch('/api/live/candles');
                const data = await res.json();
                if (data.ok) atualizarChart(data);
            } catch (err) {
                console.error(err);
            }
        }

        function iniciarPolling() {
            const output = document.getElementById('logOutput');
            output.textContent = '';
            pollInterval = setInterval(async () => {
                try {
                    const res = await fetch('/api/live/status');
                    const data = await res.json();
                    if (!data.ok) return;
                    atualizarUI(data.running, null);
                    if (data.log && data.log.length) {
                        output.textContent = data.log.join('');
                        output.scrollTop = output.scrollHeight;
                    }
                    if (!data.running && botRunning) {
                        atualizarUI(false, null);
                        pararPolling();
                        output.textContent += '\n--- Bot finalizado ---\n';
                    }
                } catch (err) { console.error(err); }
            }, 2000);
            candleInterval = setInterval(buscarCandles, 3000);
        }

        function pararPolling() {
            if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
            if (candleInterval) { clearInterval(candleInterval); candleInterval = null; }
        }

        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            try { initChart(); } catch (e) { console.error(e); }
            document.getElementById('liveForm').addEventListener('submit', iniciarBot);
            document.getElementById('btnParar').addEventListener('click', pararBot);

            fetch('/api/live/status').then(r => r.json()).then(data => {
                if (data.running) {
                    atualizarUI(true, null);
                    iniciarPolling();
                }
            }).catch(() => {});
        });
    </script>
</body>
</html>
